<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멘델의 유전 - 완두 가상 실험실</title>
<style>
:root{
  --paper:#e6efd9; --grid:rgba(47,107,58,.11);
  --board:#fbfdf6; --board-2:#f1f6e8;
  --ink:#17311f; --ink-2:#4b5f4f; --ink-3:#7c8c7e;
  --pod:#2f6b3a; --pod-d:#1c4726; --pod-l:#d5e6c2;
  --pea:#f2c53d; --pea-d:#b98b12;
  --bloom:#7a5bb0; --bloom-l:#efe7fa;
  --line:#c9d8b6;
  --ok:#1f8a4c; --ok-bg:#e1f3e7; --bad:#c8412f; --bad-bg:#fbe8e4; --warn:#9a6a00; --warn-bg:#fdf2d6; --info-bg:#eaf1fb; --info:#2b5c8f;
  --gs:#c8793f; --gc:#3f8fa8;
  --mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,"D2Coding",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; line-height:1.6; font-size:16px; min-height:100vh;
  -webkit-tap-highlight-color:transparent; word-break:keep-all;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pea);outline-offset:2px;border-radius:6px}
code{font-family:var(--mono);font-weight:700;background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--pod-d)}
.muted{color:var(--ink-3)} .small{font-size:14px}
h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.02em}

/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(28,71,38,.97);color:#fff}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.04em}
.brand p{margin:0;font-size:13px;opacity:.75}
.top-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.top-btn{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:700}
.top-btn:hover{background:rgba(255,255,255,.12)}
.stepper-wrap{background:var(--pod);border-top:1px solid rgba(255,255,255,.08)}
.stepper{max-width:1180px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step-btn{flex:none;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;border:0;background:transparent;color:#e6f0dd;cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap}
.step-btn .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:13px}
.step-btn.done .n{background:var(--pea);color:var(--pod-d)}
.step-btn.active{background:#fff;color:var(--pod-d)}
.step-btn.active .n{background:var(--pod-d);color:#fff}
.step-btn:disabled{opacity:.42;cursor:not-allowed}
.step-sep{flex:none;width:10px;height:2px;background:rgba(255,255,255,.25)}

.app{max-width:1180px;margin:0 auto;padding:18px 18px 80px}
#stage > * + *{margin-top:16px}

/* surfaces */
.card{background:var(--board);border:2px solid var(--pod-d);border-radius:14px;padding:18px;box-shadow:4px 4px 0 var(--pod-d)}
.card.soft{border:1.5px solid var(--line);box-shadow:none;background:var(--board-2)}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{font-size:19px;font-weight:800}
.card-h.sub{margin-top:18px}
.card-h h4{font-size:16px}
.card-h .btn{margin-left:auto}

.guide{display:flex;gap:14px;align-items:flex-start;padding:4px 2px}
.guide-ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--pod-d);display:grid;place-items:center}
.guide-t{font-size:22px;font-weight:900;letter-spacing:-.03em;margin-bottom:2px}
.guide p{margin:0;max-width:78ch;color:var(--ink-2)}

/* buttons */
.btn{border:2px solid var(--pod-d);border-radius:11px;padding:9px 16px;cursor:pointer;background:var(--pod);color:#fff;font-weight:800;box-shadow:0 3px 0 var(--pod-d);transition:transform .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pod-d)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:#fff;color:var(--pod-d)}
.btn.yellow{background:var(--pea);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{padding:12px 20px;font-size:17px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

.fb{border-radius:10px;padding:10px 13px;margin-top:10px;font-size:15px;border:1.5px solid}
.fb.ok{background:var(--ok-bg);border-color:#9fd3b2;color:#155f35}
.fb.bad{background:var(--bad-bg);border-color:#efb3a8;color:#8e2a1c}
.fb.warn{background:var(--warn-bg);border-color:#eed08a;color:#6b4a00}
.fb.info{background:var(--info-bg);border-color:#b8cde8;color:var(--info)}
.fb code{font-size:.95em}

.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:#e7ede0;color:var(--ink-2);border:1px solid var(--line)}
.chip.pure{background:#e3f0ff;border-color:#b5cdee;color:#23508a}
.chip.hyb{background:#fff1cc;border-color:#ecd083;color:#7a5600}
.chip.own{background:var(--bloom-l);border-color:#d2c1ec;color:#583d8a}
.chip.geno{font-family:var(--mono);background:#fff;border-color:var(--pod);color:var(--pod-d);letter-spacing:.04em}
.chip.geno.big{font-size:15px;padding:2px 10px}
.packet .chip.geno{position:static}
.role-chip{display:inline-block;font-size:13px;font-weight:800;padding:2px 10px;border-radius:8px;background:var(--pod-l);color:var(--pod-d)}
.role-chip.father{background:#e3ecf7;color:#23508a}
.empty-note{padding:14px;border:1.5px dashed var(--line);border-radius:10px;color:var(--ink-3);font-size:14px;text-align:center}
.empty-note.big{padding:40px 14px}

/* genotype inputs */
.gin{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.06em;text-align:center;padding:7px 8px;width:128px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.gin:focus{border-color:var(--pod);outline:none;box-shadow:0 0 0 3px rgba(242,197,61,.55)}
.gin.gam{width:70px}
.gin.num{width:64px;font-size:19px}
.gin.cell{width:94px;font-size:18px;padding:6px 4px}
.gin.ok{border-color:var(--ok);background:var(--ok-bg)}
.gin.bad{border-color:var(--bad);background:var(--bad-bg)}
.gin.hint{border-color:var(--pea-d);background:#fff6d6}
.gin:disabled{background:#eef1ea;opacity:.6}
.keypad{position:sticky;top:106px;z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--pod-d);color:#fff;padding:8px 10px;border-radius:12px;width:fit-content}
.keypad span{font-size:13px;opacity:.8;margin-right:4px}
.key{min-width:44px;height:42px;border-radius:9px;border:0;background:#fff;color:var(--ink);font-family:var(--mono);font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #9fb59a}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #9fb59a}
.key.wide{font-family:inherit;font-size:14px;padding:0 10px}

/* step 1 */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center;background:var(--pod-d);color:#fff;border-radius:18px;padding:26px 28px;overflow:hidden;position:relative}
.hero h2{font-size:clamp(28px,4.2vw,44px);font-weight:900;letter-spacing:-.045em;line-height:1.15}
.hero p{margin:10px 0 14px;max-width:52ch;color:#d7e6cf}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend div{background:rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;font-size:14px}
.legend b{font-family:var(--mono);color:var(--pea)}
.hero-pod{justify-self:center;width:100%;max-width:380px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer}
.seg button b{display:block;font-size:17px}
.seg button span{font-size:14px;color:var(--ink-3)}
.seg button.on{border-color:var(--pod);background:var(--pod-l);box-shadow:inset 0 0 0 1px var(--pod)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.preset{text-align:left;border:1.5px dashed var(--pod);background:transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
.preset:hover:not(:disabled){background:#fff}
.preset:disabled{opacity:.5;cursor:default}
.preset b{display:block;font-size:15px}
.preset span{font-size:13px;color:var(--ink-2)}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.slots.one{grid-template-columns:minmax(0,440px)}
.times{align-self:center;font-size:34px;font-weight:900;color:var(--pod)}
.slot{position:relative;border:2px dashed var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff;min-height:118px}
.slot.active{border:2.5px solid var(--pea-d);background:#fffbea}
.slot-label{font-size:14px;font-weight:800;color:var(--ink-2)}
.slot-seed{display:flex;gap:12px;align-items:center;margin-top:6px}
.slot-name{font-size:18px;font-weight:800}
.slot-empty{display:flex;align-items:center;gap:10px;height:70px;color:var(--ink-3);font-size:15px}
.slot-empty i{width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);flex:none}
.x-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:17px;line-height:1}
.shelf-h{font-weight:800;margin:18px 0 8px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.packet{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:26px 10px 12px;border:2px solid var(--line);border-radius:4px 4px 14px 14px;background:linear-gradient(#f3ead2 0 16px,#fff 16px);cursor:pointer;transition:transform .12s}
.packet:hover{transform:translateY(-3px);border-color:var(--pod)}
.packet.picked{border-color:var(--pea-d);box-shadow:0 0 0 3px rgba(242,197,61,.5)}
.packet .chip{position:absolute;top:4px;left:8px}
.packet-name{font-weight:800;font-size:16px}
.packet-note{font-size:12.5px;color:var(--ink-3);line-height:1.45}

/* step 2 */
.geno-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.geno-grid.one{grid-template-columns:minmax(0,640px)}
.gc-head{display:flex;gap:14px;align-items:flex-start;padding-bottom:12px;border-bottom:1.5px dashed var(--line)}
.gc-head h3{font-size:21px;font-weight:900;margin:4px 0}
.gc-head p{margin:6px 0 0;font-size:13.5px;color:var(--ink-3)}
.q{padding-top:14px}
.q + .q{margin-top:6px;border-top:1.5px dashed var(--line)}
.q-t{font-weight:700}
.qn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pod-d);color:#fff;font-size:13px;margin-right:4px}
.q.locked{opacity:.6}
.meiosis{margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px}
.meio-svg{width:100%;max-width:400px;display:block;margin:auto}
.meio-svg .cell{fill:#fff6d8;stroke:#d7b45e;stroke-width:2}
.meio-svg .gcell{fill:#fff6d8;stroke:#d7b45e;stroke-width:1.5}
.rod.shape{fill:var(--gs)} .rod.color{fill:var(--gc)}
.rod-t{fill:#fff;font-family:var(--mono);font-weight:800;font-size:13px;text-anchor:middle}
.meio-svg .arrow{fill:none;stroke:#a6a58a;stroke-width:2;stroke-dasharray:5 4}
.meio-svg .cap{font-size:12px;fill:var(--ink-2);text-anchor:middle;font-weight:700}
.meio-svg .frac{font-size:13px;fill:var(--ink-2);font-weight:800}
details.hint{background:var(--board-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
details.hint summary{cursor:pointer;font-weight:800}
details.hint table{border-collapse:collapse;margin-top:8px;font-size:14px}
details.hint td,details.hint th{border:1px solid var(--line);padding:4px 10px;text-align:center;background:#fff}

/* step 3 */
.garden{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr)) minmax(240px,1.1fr);gap:16px;align-items:start}
.pot-card{text-align:center}
.pot-wrap{position:relative;max-width:240px;margin:6px auto 0;border-radius:14px;background:linear-gradient(#e8f4fb,#f6fbf1 70%)}
.pot-wrap[data-act]{cursor:pointer;outline:2.5px dashed var(--pea-d);outline-offset:-2.5px}
.plant-svg{display:block;width:100%}
.plant-hint{position:absolute;left:50%;top:30%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;color:var(--pod-d);background:rgba(255,255,255,.85);padding:8px 12px;border-radius:12px}
.drops{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:14px}
.drops i{position:absolute;top:-12px;width:7px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#4aa3df;opacity:0}
.drops i:nth-child(1){left:36%}.drops i:nth-child(2){left:46%;animation-delay:.15s!important}.drops i:nth-child(3){left:56%;animation-delay:.3s!important}.drops i:nth-child(4){left:64%;animation-delay:.1s!important}.drops i:nth-child(5){left:42%;animation-delay:.42s!important}
.watering .drops i{animation:drop .8s ease-in 2}
@keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(210px);opacity:.2}}
.grew .plant-svg{animation:growin .7s ease}
@keyframes growin{0%{transform:scale(.96);filter:brightness(1.2)}100%{transform:none}}
.stage-bar{display:flex;gap:4px;justify-content:center;margin-top:10px}
.stage-bar span{width:30px;height:7px;border-radius:4px;background:#d9e3cf}
.stage-bar span.on{background:var(--pod)}
.stage-name{font-weight:800;margin-top:4px}
.grow-ctrl{background:var(--board-2);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.day{font-size:40px;font-weight:900;line-height:1;margin-bottom:10px;color:var(--pod-d)}
.day small{font-size:16px;margin-left:4px}
.log{list-style:none;margin:12px 0 0;padding:0;max-height:180px;overflow:auto;font-size:14px}
.log li{padding:5px 0;border-top:1px dashed var(--line)}
.flips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flip{position:relative;min-height:128px;border-radius:12px;border:2px solid var(--pod);background:var(--pod-l);cursor:pointer;padding:12px;text-align:left}
.flip .front{font-weight:800;font-size:17px;color:var(--pod-d)}
.flip .front small{display:block;font-weight:600;font-size:13px;color:var(--ink-2)}
.flip .back{display:none;font-size:14px}
.flip .back b{display:block;font-size:16px;margin-bottom:2px}
.flip.on{background:#fff}
.flip.on .front{display:none}.flip.on .back{display:block}

/* step 4 */
.pol-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.pol-side{position:sticky;top:120px}
.side-h{font-weight:800;font-size:14px;color:var(--ink-2);margin:12px 0 6px}
.side-h:first-child{margin-top:0}
.tools{display:flex;gap:8px}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:800;font-size:14px}
.tool svg{width:36px;height:36px}
.tool.on{border-color:var(--bloom);background:var(--bloom-l);box-shadow:inset 0 0 0 1px var(--bloom)}
.tasks{margin:0;padding:0;list-style:none;counter-reset:t}
.tasks li{counter-increment:t;display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14.5px}
.tasks li::before{content:counter(t);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line);background:#fff}
.tasks li.done{color:var(--ink-3);text-decoration:line-through}
.tasks li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.switch{display:flex;gap:6px;align-items:center;font-size:14px;margin-top:8px;cursor:pointer}
.pol-flowers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pol-flowers.one{grid-template-columns:minmax(0,520px)}
.flower-card{padding:10px}
.flower-card.mother{border-color:var(--bloom);box-shadow:4px 4px 0 var(--bloom)}
.fc-h{font-weight:800;padding:2px 6px 6px;display:flex;gap:8px;align-items:center}
.lab{border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff 0,#f3f7ee 70%);touch-action:manipulation}
@media (pointer:fine){.lab{cursor:none}}
.flower-svg{display:block;width:100%}
.stamen{transform-box:fill-box;transform-origin:50% 100%;cursor:pointer}
.stamen:hover>ellipse{stroke:#d9531e;stroke-width:3}
.stamen.removed{opacity:0;pointer-events:none}
.stamen.just{animation:pluck .6s ease-in forwards}
@keyframes pluck{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(-10px,-46px) rotate(-30deg)}}
.pistil{cursor:pointer}
.pistil:hover .stig{stroke:#d9531e;stroke-width:3}
.pollen.pop circle{transform-box:fill-box;transform-origin:center;animation:popin .5s cubic-bezier(.2,.9,.3,1.5) both}
.bag.drop{animation:bagdrop .6s cubic-bezier(.2,.8,.3,1.15)}
@keyframes bagdrop{from{transform:translateY(-320px);opacity:0}to{transform:none;opacity:1}}
.lbl line{stroke:#8c7fa6;stroke-width:1.2}
.lbl text{font-size:13px;font-weight:800;fill:#3e3159;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.bag-t{font-size:16px;font-weight:800;fill:#6b5f3d}
#toolCursor{position:fixed;left:0;top:0;z-index:100;pointer-events:none;display:none;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.25))}
.quiz{margin-top:14px;border-top:1.5px dashed var(--line);padding-top:12px}
.quiz-q{font-weight:800;margin-bottom:8px}
.quiz-o{display:block;width:100%;text-align:left;padding:9px 12px;margin-top:6px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer}
.quiz-o:hover{border-color:var(--pod)}
.quiz-o.right{border-color:var(--ok);background:var(--ok-bg);font-weight:800}
.quiz-o.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.quiz-o:disabled{cursor:default}

/* step 5 */
.pun-scroll{overflow-x:auto;padding:4px}
.punnett{border-collapse:separate;border-spacing:6px;margin:0 auto}
.punnett th,.punnett td{text-align:center}
.punnett .corner{position:relative;width:96px;height:62px;background:linear-gradient(to top right,#fff calc(50% - 1px),var(--line) 50%,#fff calc(50% + 1px));border-radius:10px;border:1.5px solid var(--line)}
.punnett .corner span{position:absolute;font-size:12px;font-weight:800}
.punnett .corner .c-m{left:6px;bottom:4px;color:var(--bloom)}
.punnett .corner .c-f{right:6px;top:4px;color:#23508a}
.gh{padding:4px}
.gchip{display:inline-flex;border-radius:9px;overflow:hidden;font-family:var(--mono);font-size:19px;font-weight:800;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.gchip b{padding:4px 8px}
.gchip .s{background:var(--gs)} .gchip .c{background:var(--gc)}
.gh.m .gchip{outline:2.5px solid var(--bloom);outline-offset:2px}
.gh.f .gchip{outline:2.5px solid #23508a;outline-offset:2px}
.punnett td{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 6px 6px;min-width:136px}
.punnett td.ok,.punnett td.hint{background:var(--ok-bg)}
.punnett td.bad{background:var(--bad-bg)}
.cell-phen{display:flex;justify-content:center;gap:2px;margin-top:5px;padding:2px;border-radius:9px;border:1.5px dashed var(--line)}
.cell-phen.ok{border-style:solid;border-color:var(--ok);background:#fff}
.cell-phen.bad{border-style:solid;border-color:var(--bad)}

<script>
/* =========================================================
   0. 도우미
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const sum = a => a.reduce((x, y) => x + y, 0);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gcd = (a, b) => (b ? gcd(b, a % b) : a);

/* =========================================================
   1. 유전 계산
   ========================================================= */
const PH = {
  RY: { name: '둥글고 노란색', shape: '둥근', color: '노란색' },
  Ry: { name: '둥글고 초록색', shape: '둥근', color: '초록색' },
  rY: { name: '주름지고 노란색', shape: '주름진', color: '노란색' },
  ry: { name: '주름지고 초록색', shape: '주름진', color: '초록색' }
};
const PK = ['RY', 'Ry', 'rY', 'ry'];
const PCOLOR = { RY: '#e9b820', Ry: '#6fae3a', rY: '#c7771a', ry: '#2f6b3a' };
const GENO9 = ['RRYY', 'RRYy', 'RRyy', 'RrYY', 'RrYy', 'Rryy', 'rrYY', 'rrYy', 'rryy'];

const pk = g => (g.includes('R') ? 'R' : 'r') + (g.includes('Y') ? 'Y' : 'y');
const pair = (a, b) => [a, b].sort().join('');            // 'R' < 'r' (대문자 먼저)
const fuse = (a, b) => pair(a[0], b[0]) + pair(a[1], b[1]); // 생식세포 두 개 → 자손 유전자형
const gam4 = g => [g[0] + g[2], g[0] + g[3], g[1] + g[2], g[1] + g[3]];
const uniqGam = g => [...new Set(gam4(g))];
const randGam = g => g[rnd(2)] + g[2 + rnd(2)];
const isHomo = g => g[0] === g[1] && g[2] === g[3];
const heteroN = g => (g[0] !== g[1] ? 1 : 0) + (g[2] !== g[3] ? 1 : 0);

function expect(m, f) {
  const geno = {}, ph = { RY: 0, Ry: 0, rY: 0, ry: 0 };
  for (const a of gam4(m)) for (const b of gam4(f)) {
    const g = fuse(a, b);
    geno[g] = (geno[g] || 0) + 1;
    ph[pk(g)]++;
  }
  return { geno, ph }; // 합계 16
}
function simp(arr) {
  const nz = arr.filter(x => x > 0);
  if (!nz.length) return arr.slice();
  const g = nz.reduce((a, b) => gcd(a, b));
  return arr.map(x => x / g);
}
function sameRatio(a, b) {
  const sa = sum(a), sb = sum(b);
  if (!sa || !sb) return false;
  return a.every((x, i) => Math.abs(x / sa - b[i] / sb) < 1e-6);
}
function frac(a, b) {
  if (!a) return '0';
  const g = gcd(a, b);
  return a === b ? '1 (100%)' : `${a / g}/${b / g}`;
}

function parseGeno(raw) {
  const s = String(raw || '').replace(/[\s,]/g, '');
  if (!s) return { ok: false, msg: '유전자형을 입력하세요.' };
  if (/[^RrYy]/.test(s)) return { ok: false, msg: 'R, r, Y, y 네 가지 기호만 사용해서 써요.' };
  const R = [...s].filter(c => c === 'R' || c === 'r');
  const Y = [...s].filter(c => c === 'Y' || c === 'y');
  if (R.length !== 2 || Y.length !== 2)
    return { ok: false, msg: `체세포에는 대립유전자가 <b>쌍</b>으로 있어요. 모양 유전자(R, r) 2개와 색깔 유전자(Y, y) 2개, 모두 4글자로 써요. (지금 모양 ${R.length}개, 색깔 ${Y.length}개)` };
  const canon = R.sort().join('') + Y.sort().join('');
  return { ok: true, canon, tidy: s === canon };
}
function parseGamete(raw) {
  const s = String(raw || '').replace(/[\s,]/g, '');
  if (!s) return null;
  if (/[^RrYy]/.test(s)) return { ok: false, msg: `‘${esc(s)}’: R, r, Y, y 기호만 사용해요.` };
  const R = [...s].filter(c => c === 'R' || c === 'r');
  const Y = [...s].filter(c => c === 'Y' || c === 'y');
  if (R.length >= 2 || Y.length >= 2)
    return { ok: false, msg: `‘${esc(s)}’: 생식세포에는 쌍을 이루던 대립유전자 중 <b>하나씩만</b> 들어가요. 같은 형질의 유전자가 2개 들어갈 수 없어요. (분리의 법칙)` };
  if (R.length !== 1 || Y.length !== 1)
    return { ok: false, msg: `‘${esc(s)}’: 생식세포에는 모양 유전자 1개와 색깔 유전자 1개가 <b>함께</b> 들어가요.` };
  return { ok: true, canon: R[0] + Y[0] };
}

/* =========================================================
   2. 씨앗과 상태
   ========================================================= */
const LIB = [
  { id: 'L1', geno: 'RRYY', tag: '순종', gen: 'P', note: '여러 세대 동안 자가 수분해도 늘 둥글고 노란색 완두만 나오는 계통' },

function barChart(obs, E, n, showExp) {

  const max = Math.min(100, Math.ceil((Math.max(...vals, ...(showExp ? ex : [0])) + 8) / 10) * 10) || 10;
  const y = v => pt + ph * (1 - v / max);

  const stepV = max > 50 ? 20 : 10;
  for (let v = 0; v <= max; v += stepV) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3eadb"/><text x="${pl - 8}" y="${y(v) + 4}" font-size="12" text-anchor="end" fill="#7c8c7e">${v}%</text>`;
  PK.forEach((k, i) => {

    const ox = showExp ? cx - bw - 3 : cx - bw / 2;
    s += `<rect x="${ox}" y="${y(vals[i])}" width="${bw}" height="${pt + ph - y(vals[i])}" rx="4" fill="${PCOLOR[k]}"/>`;

/* 수확량에 따른 비율 변화 그래프 */
function convChart(seeds, E, showExp) {
  const n = seeds.length, W = 640, H = 280, pl = 48, pr = 16, pt = 16, pb = 42;
  const x = k => pl + (W - pl - pr) * (k / n), y = v => pt + (H - pt - pb) * (1 - v / 100);
  const every = Math.max(1, Math.ceil(n / 80));
  const pts = { RY: [], Ry: [], rY: [], ry: [] }, c = { RY: 0, Ry: 0, rY: 0, ry: 0 };
  for (let i = 0; i < n; i++) {
    c[pk(seeds[i])]++;
    const k = i + 1;
    if (k >= 3 && (k % every === 0 || k === n)) PK.forEach(p => pts[p].push(`${x(k).toFixed(1)},${y(c[p] / k * 100).toFixed(1)}`));
  }
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="수확한 완두 수에 따른 표현형 비율 변화">`;
  [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3eadb"/><text x="${pl - 8}" y="${y(v) + 4}" font-size="12" text-anchor="end" fill="#7c8c7e">${v}%</text>`; });
  [0, Math.round(n / 2), n].forEach(k => { s += `<text x="${x(k)}" y="${H - pb + 18}" font-size="12" text-anchor="middle" fill="#7c8c7e">${k}</text>`; });
  s += `<text x="${(W + pl) / 2}" y="${H - 6}" font-size="12.5" text-anchor="middle" fill="#4b5f4f" font-weight="700">수확해서 센 완두의 수 (개)</text>`;
  if (showExp) PK.forEach(k => { if (E.ph[k] > 0) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(E.ph[k] / 16 * 100)}" y2="${y(E.ph[k] / 16 * 100)}" stroke="${PCOLOR[k]}" stroke-width="1.8" stroke-dasharray="6 5" opacity=".8"/>`; });
  PK.forEach(k => { s += `<polyline points="${pts[k].join(' ')}" fill="none" stroke="${PCOLOR[k]}" stroke-width="2.6" stroke-linejoin="round"/>`; });
  return s + '</svg>' + `<div class="legend2">${PK.map(k => `<span><i style="background:${PCOLOR[k]}"></i>${PH[k].name}</span>`).join('')}</div>`;
}

function toast(t) {

}
function animateCount(el, from, to, ms = 700) {
  if (!el) return;
  const t0 = performance.now();
  const tick = t => {
    const p = Math.min(1, (t - t0) / ms);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

  ${nav(1, 3, stepDone(2), '유전자형과 생식세포를 모두 맞혀야 다음 단계로 갈 수 있어요')}`;
};
ACT.chkGeno = r => {
  const a = S.ans[r], sd = S[r], p = parseGeno(a.geno);
  a.gTries++; a.actual = false;
  a.mStat = null; a.mMsg = ''; a.gamMarks = ['', '', '', ''];
  if (!p.ok) { a.gStat = 'bad'; a.gMsg = p.msg; return render(); }
  const tidy = p.tidy ? '' : `<br>쓰는 약속: 같은 형질의 유전자끼리 붙여 쓰고 대문자를 먼저 써요. 그래서 <code>${p.canon}</code>로 고쳐 두었어요.`;
  if (sd.possible.includes(p.canon)) {
    a.geno = p.canon;
    if (sd.possible.length === 1) { a.gStat = 'ok'; a.gMsg = `정답이에요! ${genoExplain(sd)}${tidy}`; }
    else {
      a.gStat = 'possible';
      a.gMsg = `가능한 답이에요. 어버이와 표현형으로 따져 보면 이 완두의 유전자형은 ${sd.possible.map(x => `<code>${x}</code>`).join(', ')} 중 하나예요. 겉모습(표현형)만으로는 어느 것인지 <b>확정할 수 없어요.</b> 주름지고 초록색 완두(rryy)와 교배해 자손을 보면 알아낼 수 있답니다.${tidy}`;
    }

};
ACT.showGeno = r => {
  const a = S.ans[r], sd = S[r];
  a.geno = sd.geno; a.gStat = 'shown'; a.actual = true;
  a.gMsg = sd.possible.length === 1 ? `정답은 <code>${sd.geno}</code>예요. ${genoExplain(sd)}`
    : `가능한 유전자형은 ${sd.possible.map(x => `<code>${x}</code>`).join(', ')}이고, 이 완두의 실제 유전자형은 <code>${sd.geno}</code>예요.`;

ACT.actualGeno = r => {

ACT.chkGam = r => {
  const a = S.ans[r], basis = parseGeno(a.geno);
  if (!basis.ok) return;
  const B = basis.canon, need = uniqGam(B);
  a.mTries++;
  const parsed = a.gam.map(parseGamete), filled = parsed.filter(Boolean);
  if (!filled.length) { a.mStat = 'bad'; a.mMsg = '생식세포의 유전자형을 입력하세요.'; return render(); }
  a.gamMarks = parsed.map(x => (!x ? '' : x.ok && need.includes(x.canon) ? 'ok' : 'bad'));
  const bad = filled.filter(x => !x.ok);
  if (bad.length) { a.mStat = 'bad'; a.mMsg = bad[0].msg; return render(); }
  const got = [...new Set(filled.map(x => x.canon))];
  const extra = got.filter(x => !need.includes(x)), missing = need.filter(x => !got.includes(x));
  if (!extra.length && !missing.length) {
    a.mStat = 'ok';
    a.mMsg = `정답이에요! <code>${B}</code>인 완두는 ${need.map(x => `<code>${x}</code>`).join(', ')} ${need.length === 1 ? '<b>한 종류</b>의 생식세포만 만들어요.' : `<b>${need.length}종류</b>의 생식세포를 ${need.map(() => 1).join(' : ')}의 비로 만들어요.`}${filled.length > got.length ? ' (같은 생식세포는 한 번만 써도 돼요.)' : ''}`;
    a.gam = [...need, ...Array(4 - need.length).fill('')];
    a.gamMarks = need.map(() => 'ok').concat(Array(4 - need.length).fill(''));
  } else {
    const m = [];
    extra.forEach(x => {
      const lack = [...x].filter((c, i) => !B.slice(i * 2, i * 2 + 2).includes(c));
      m.push(`<code>${x}</code>는 만들어질 수 없어요. 이 완두(<code>${B}</code>)에는 ${lack.join(', ')} 유전자가 없어요.`);
    });
    if (missing.length) m.push(`만들어질 수 있는 생식세포 중 <b>${missing.length}가지</b>가 빠졌어요. 모양 유전자 하나와 색깔 유전자 하나를 짝짓는 경우를 모두 찾아보세요.`);
    a.mStat = 'bad'; a.mMsg = m.join('<br>');
  }
  render();
};
ACT.showGam = r => {
  const a = S.ans[r], need = uniqGam(parseGeno(a.geno).canon);
  a.gam = [...need, ...Array(4 - need.length).fill('')];
  a.gamMarks = need.map(() => 'ok').concat(Array(4 - need.length).fill(''));
  a.mStat = 'shown';
  a.mMsg = `정답: ${need.map(x => `<code>${x}</code>`).join(', ')}. 쌍을 이루는 대립유전자가 나뉘어 모양 유전자 하나, 색깔 유전자 하나씩 들어가요.`;

  if (!inp || inp.disabled) inp = all.find(x => !x.value) || null;
  if (!inp) { toast('먼저 입력 칸을 눌러 주세요'); return; }
  if (k === 'next') {
    const nx = all[all.indexOf(inp) + 1] || all[0];
    if (nx) { nx.focus(); lastBind = nx.dataset.bind; }
    return;
  }
  if (k === 'back') inp.value = inp.value.slice(0, -1);
  else if (inp.value.length < (inp.maxLength > 0 ? inp.maxLength : 8)) inp.value += k;
  inp.dispatchEvent(new Event('input', { bubbles: true }));

};

function punBase() {

  mg.forEach(a => fg.forEach(b => { const g = fuse(a, b); cnt[pk(g)]++; gc[g] = (gc[g] || 0) + 1; }));
  return { mg, fg, N: mg.length * fg.length, cnt, gc };
}

    }).join('')}</tr>`;
  });
  grid += '</table>';
  const both = okStat(U.gStat) && U.cStat === 'ok';

ACT.chkPun = () => {
  const U = S.pun, { mg, fg, N } = punBase();
  let ok = 0, gBad = 0, gEmpty = 0, pBad = 0, pEmpty = 0;
  U.tries++;
  mg.forEach((a, i) => fg.forEach((b, j) => {
    const k = `${i}_${j}`, want = fuse(a, b), v = (U.cells[k] || '').trim(), p = parseGeno(v);
    const gOk = !!v && p.ok && p.canon === want;
    if (gOk) { U.cells[k] = p.canon; U.marks[k] = U.marks[k] === 'hint' ? 'hint' : 'ok'; }
    else { U.marks[k] = 'bad'; if (v) gBad++; else gEmpty++; }
    const sel = U.phen[k], pOk = sel === pk(want);
    U.pMarks[k] = !sel ? 'bad' : pOk ? 'ok' : 'bad';
    if (!sel) pEmpty++; else if (!pOk) pBad++;
    if (gOk && pOk) ok++;

    if (pEmpty) m.push(`<b>표현형</b>: 아직 완두를 고르지 않은 칸이 ${pEmpty}칸 있어요. 유전자형 아래에서 어떤 완두가 될지 골라 주세요.`);
    if (pBad) m.push('<b>표현형</b>: R가 하나라도 있으면 둥근 모양, rr일 때만 주름진 모양이에요. Y가 하나라도 있으면 노란색, yy일 때만 초록색이에요.');
    U.gStat = 'bad'; U.gMsg = m.join('<br>');
  }
  render();

ACT.showPun = () => {

const SAVE_KEY = 'mendel-pea-lab-v1';
let saveOK = true;

}
function saveState() {

  }

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || o.v !== 1 || !o.S) return null;
    Object.assign(S, o.S);
    if (o.uidC) uidC = o.uidC;
    if (o.expC) expC = o.expC;
    S.watering = false; S.grew = false; S.hv.last = null;
    S.st.justBin = null; S.st.shake = null; S.st.sel = null;

  } catch (e) { return null; }
}
function saveNote(o) {
  const d = new Date(o.at), pad = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}에 하던 실험을 이어서 열었어요. 처음부터 하려면 오른쪽 위 ‘처음부터’를 누르세요.`;
}
function packState() {
  const c = JSON.parse(JSON.stringify({ v: 2, uidC, expC, at: Date.now(), S }));
  c.S.hv.seeds = c.S.hv.seeds.join('');
  c.S.hv.pods = c.S.hv.pods.map(p => ({ o: p.open ? 1 : 0, s: p.seeds.join('') }));
  return c;
}
function unpackState(d) {
  const s = JSON.parse(JSON.stringify(d.S));
  const cut = x => (typeof x === 'string' ? (x.match(/.{4}/g) || []) : x || []);
  s.hv.seeds = cut(s.hv.seeds);
  s.hv.pods = (s.hv.pods || []).map(p => (p && p.s !== undefined ? { open: !!p.o, seeds: cut(p.s) } : p));
  return s;
}
const DATA_TAG = '#MENDEL-DATA#';

    '================================================',
    '  멘델의 유전 - 가상 실험 기록',

    `이름      : ${S.who || '(입력 안 함)'}`,

    `끝낸 단계 : 7단계 중 ${done.length}개 ${done.length ? '(' + done.join(', ') + '단계)' : '(없음)'}`,

    L.push('------------------------------------------------', '  실험 결과', '------------------------------------------------');

ACT.importRun = () => {

document.addEventListener('dragleave', e => { const b = e.target.closest && e.target.closest('[data-bin]'); if (b) b.classList.remove('over'); });
document.addEventListener('drop', e => {
  const b = e.target.closest && e.target.closest('[data-bin]');
  if (!b) return;
  e.preventDefault();
  const i = e.dataTransfer.getData('text/plain');
  if (i !== '' && !S.st.counted) dropPea(+i, b.dataset.bin);
});
/* 수분 도구 커서 */
let cursorKey = '';
document.addEventListener('pointermove', e => {
  const c = $('#toolCursor');
  const lab = S.step === 4 && e.pointerType === 'mouse' && e.target.closest && e.target.closest('.lab');
  if (!lab) { if (c.style.display !== 'none') c.style.display = 'none'; return; }
  const key = S.pol.tool === 'brush' && S.pol.brush ? 'brushLoaded' : S.pol.tool;
  if (key !== cursorKey) { c.innerHTML = ICON[key]; cursorKey = key; }
  c.style.display = 'block';
  const off = S.pol.tool === 'bag' ? 22 : 2;
  c.style.transform = `translate(${e.clientX - off}px, ${e.clientY - off}px)`;
});

let saved = loadState();
try { render(); }
catch (e) {
  saved = null;
  hardReset(); render();
  setTimeout(() => toast('저장된 내용을 열 수 없어서 처음부터 시작해요'), 400);
}
if (saved) setTimeout(() => toast(saveNote(saved)), 500);
</script>
</body>
</html>
